<div class="products-page">
  <app-header />

  <!-- Main Content -->
  <div class="content-wrapper">
    <main class="main-content">
      <div class="title-section">
        <h1 class="page-title">
          Товары за баллы<sup class="product-count">{{ productsCount }}</sup>
        </h1>
      </div>

      <!-- Category Filters -->
      <div class="filters">
        @for (category of categories; track category) {
          <button
            class="filter-btn"
            [class.active]="selectedCategory() === category"
            (click)="selectCategory(category)"
          >
            {{ category }}
          </button>
        }
      </div>

      <!-- Products Grid -->
      <div class="products-grid">
        @for (product of filteredProducts; track product.id) {
          <a [routerLink]="['/product', product.id]" class="product-card">
            <div class="product-image">
              <div class="image-placeholder" [class]="'image-' + product.image"></div>
            </div>
            <div class="product-price">{{ product.price }} P</div>
            <div class="product-name">{{ product.name }}</div>
            <div class="product-status" [class.in-stock]="product.inStock" [class.out-of-stock]="!product.inStock">
              {{ product.inStock ? 'В наличии' : 'Нет в наличии' }}
            </div>
          </a>
        }
      </div>
    </main>
  </div>
</div>
