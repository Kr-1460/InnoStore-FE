<div class="w-full flex flex-col h-full bg-white rounded-2xl shadow-sm overflow-hidden">
  <div class="p-8 grow overflow-y-auto">
    <div class="flex justify-between items-start mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Добавление товара</h1>

      <app-inno-store-switcher
        [options]="languageOptions()"
        [active]="activeLang()"
        (select)="activeLang.set($event)"
      />
    </div>

    <form [formGroup]="productForm" class="contents">
      <app-product-content-section
        [parentForm]="productForm"
        [categories]="categories() || []"
        [activeLang]="activeLang()"
      />

      <app-product-color-section
        [selectedColors]="addedColors()"
        [activeColorId]="selectedColorId()"
        (colorSelect)="onColorChanged($event)"
        (colorAdded)="onColorAdded($event)"
        (removeColor)="onColorRemoved($event)"
        (colorChanged)="onColorUpdated($event)"
      />

      <div class="mt-8 border-t border-gray-100 pt-8">
        <app-product-size-section [parentForm]="productForm" [activeLang]="activeLang()" />
      </div>
    </form>
  </div>

  <div class="p-6 border-t border-gray-50 bg-gray-50/50">
    <button
      (click)="submit()"
      [disabled]="productForm.invalid || addedColors().length === 0 || !hasImages()"

      class="w-full py-4 font-semibold rounded-xl transition-all shadow-lg active:scale-[0.98] flex justify-center items-center gap-2"
      [class.bg-blue-600]="productForm.valid && addedColors().length > 0 && hasImages()"
      [class.hover:bg-blue-700]="productForm.valid && addedColors().length > 0 && hasImages()"
      [class.bg-gray-200]="productForm.invalid || addedColors().length === 0 || !hasImages()"
      [class.text-white]="productForm.valid && addedColors().length > 0 && hasImages()"
      [class.text-gray-500]="productForm.invalid || addedColors().length === 0 || !hasImages()"
      [class.shadow-blue-200]="productForm.valid && addedColors().length > 0 && hasImages()"
    >
      Сохранить товар
    </button>
  </div>
</div>
